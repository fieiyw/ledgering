<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal & Ledger Tracker</title>
  <style>
    :root {
      --bg: #fff3f7;
      --panel: #ffffff;
      --soft: #ffe7f1;
      --primary: #f06292;
      --primary-dark: #e91e63;
      --text: #382d38;
      --muted: #6d5367;
      --border: #f3d6e3;
      --shadow: 0 6px 18px rgba(240, 98, 146, 0.12);
      --danger: #d65c74;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1500px;
      margin: 30px auto;
      padding: 20px;
    }

    .title-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .logo {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #ffdfea, #f7bfd2);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-size: 2rem;
    }

    h1 {
      margin: 0;
      font-size: 2.6rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1.2fr 1fr 1.2fr 1fr;
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 7px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
    }

    input, button {
      border-radius: 10px;
      border: 1px solid #f1ccd8;
      height: 46px;
      padding: 10px 12px;
      font-size: 15px;
      font-family: "Times New Roman", Times, serif;
      outline: none;
    }

    input {
      background: #fff;
      color: var(--text);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.12);
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .summary-box {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 85px;
    }

    .summary-title {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .summary-value {
      font-size: 1.7rem;
      font-weight: 700;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 24px;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      background: linear-gradient(135deg, #ffeaf2, #ffdbe8);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      font-size: 1.35rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid #f4e2eb;
      font-size: 14px;
    }

    th {
      background: #fff7fb;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    tbody tr:hover {
      background: #fffafc;
    }

    .money {
      font-variant-numeric: tabular-nums;
    }

    .ledger-group {
      margin-bottom: 24px;
    }

    .ledger-group h3 {
      margin: 0 0 10px;
      padding: 0 10px;
      font-size: 1.3rem;
    }

    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }

    .delete-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      height: auto;
    }

    .delete-btn:hover {
      background: #d14163;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    @media (max-width: 1100px) {
      .form-grid {
        grid-template-columns: repeat(3, minmax(160px, 1fr));
      }

      .two-col {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .summary-row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2rem;
      }

      .title-row {
        flex-direction: column;
      }
    }
  </style>
</head>

      <div class="logo">📒</div>
      <h1>Journal & Ledger Tracker</h1>
    </div>
