<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal & Ledger Tracker</title>
  <style>
    :root {
      --bg: #fff3f7;
      --panel: #ffffff;
      --soft: #ffe7f1;
      --primary: #f06292;
      --primary-dark: #e91e63;
      --text: #382d38;
      --muted: #6d5367;
      --border: #f3d6e3;
      --shadow: 0 6px 18px rgba(240, 98, 146, 0.12);
      --danger: #d65c74;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 20px;
    }

    .title-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .logo {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #ffdfea, #f7bfd2);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-size: 2rem;
    }

    h1 {
      margin: 0;
      font-size: 2.6rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 7px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
    }

    input, button {
      border-radius: 10px;
      border: 1px solid #f1ccd8;
      height: 46px;
      padding: 10px 12px;
      font-size: 15px;
      font-family: "Times New Roman", Times, serif;
      outline: none;
    }

    input {
      background: #fff;
      color: var(--text);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.12);
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .summary-box {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 85px;
    }

    .summary-title {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .summary-value {
      font-size: 1.7rem;
      font-weight: 700;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      background: linear-gradient(135deg, #ffeaf2, #ffdbe8);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      font-size: 1.35rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid #f4e2eb;
      font-size: 14px;
    }

    th {
      background: #fff7fb;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    tbody tr:hover {
      background: #fffafc;
    }

    .money {
      font-variant-numeric: tabular-nums;
    }

    .ledger-group {
      margin-bottom: 24px;
    }

    .ledger-group h3 {
      margin: 0 0 10px;
      padding: 0 10px;
      font-size: 1.3rem;
    }

    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }

    .delete-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      height: auto;
    }

    .delete-btn:hover {
      background: #d14163;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-row">
      <div class="logo">📒</div>
      <h1>Journal & Ledger Tracker</h1>
    </div>

    <div class="panel">
      <div class="form-grid">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Cash Sale" />
        </div>

        <div class="field">
          <label for="debit">Debit</label>
          <input id="debit" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>

        <div class="field">
          <label for="credit">Credit</label>
          <input id="credit" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>

      <button id="addEntryBtn" class="primary-btn">Add Entry</button>

      <div class="summary-row">
        <div class="summary-box">
          <span class="summary-title">Total Debits</span>
          <span id="totalDebits" class="summary-value">$0.00</span>
        </div>

        <div class="summary-box">
          <span class="summary-title">Total Credits</span>
          <span id="totalCredits" class="summary-value">$0.00</span>
        </div>

        <div class="summary-box">
          <span class="summary-title">Difference</span>
          <span id="netDifference" class="summary-value">$0.00</span>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="section">
        <div class="section-header">Journal Entries</div>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Debit</th>
              <th>Credit</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="journalBody"></tbody>
        </table>
      </div>

      <div class="section">
        <div class="section-header">Ledger</div>
        <div id="ledgerContainer"></div>
      </div>
    </div>

    <div class="footer">Made by Breanna 💕</div>
  </div>

  <script>
    const storageKey = "journalSimpleEntries";

    function loadEntries() {
      const saved = localStorage.getItem(storageKey);
      return saved ? JSON.parse(saved) : [];
    }

    function saveEntries(entries) {
      localStorage.setItem(storageKey, JSON.stringify(entries));
    }

    function money(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(Number(value) || 0);
    }

    function num(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function renderSummary(entries) {
      const totalDebits = entries.reduce((sum, entry) => sum + num(entry.debit), 0);
      const totalCredits = entries.reduce((sum, entry) => sum + num(entry.credit), 0);

      document.getElementById("totalDebits").textContent = money(totalDebits);
      document.getElementById("totalCredits").textContent = money(totalCredits);
      document.getElementById("netDifference").textContent = money(totalDebits - totalCredits);
    }

    function renderJournal(entries) {
      const tbody = document.getElementById("journalBody");
      tbody.innerHTML = "";

      if (!entries.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4">
              <div class="empty">No entries yet.</div>
            </td>
          </tr>
        `;
        return;
      }

      entries.forEach((entry, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.title}</td>
          <td class="money">${entry.debit ? money(entry.debit) : "-"}</td>
          <td class="money">${entry.credit ? money(entry.credit) : "-"}</td>
          <td><button class="delete-btn" data-index="${index}">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const index = Number(btn.dataset.index);
          const updated = loadEntries();
          updated.splice(index, 1);
          saveEntries(updated);
          renderAll();
        });
      });
    }

    function renderLedger(entries) {
      const container = document.getElementById("ledgerContainer");
      const ledgerMap = new Map();

      entries.forEach(entry => {
        const title = (entry.title || "Untitled").trim();

        if (!ledgerMap.has(title)) {
          ledgerMap.set(title, []);
        }

        ledgerMap.get(title).push({
          title: title,
          debit: num(entry.debit),
          credit: num(entry.credit)
        });
      });

      if (!ledgerMap.size) {
        container.innerHTML = '<div class="empty">No ledger entries yet.</div>';
        return;
      }

      const html = [];

      ledgerMap.forEach((items, title) => {
        let runningBalance = 0;

        const rows = items.map(item => {
          runningBalance += item.debit - item.credit;
          return `
            <tr>
              <td>${item.title}</td>
              <td class="money">${item.debit ? money(item.debit) : "-"}</td>
              <td class="money">${item.credit ? money(item.credit) : "-"}</td>
              <td class="money">${money(runningBalance)}</td>
            </tr>
          `;
        }).join("");

        html.push(`
          <div class="ledger-group">
            <h3>${title}</h3>
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Debit</th>
                  <th>Credit</th>
                  <th>Balance</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `);
      });

      container.innerHTML = html.join("");
    }

    function renderAll() {
      const entries = loadEntries();
      renderSummary(entries);
      renderJournal(entries);
      renderLedger(entries);
    }

    function addEntry() {
      const title = document.getElementById("title").value.trim();
      const debit = num(document.getElementById("debit").value);
      const credit = num(document.getElementById("credit").value);

      if (!title) {
        alert("Please enter a title.");
        return;
      }

      if (!debit && !credit) {
        alert("Please enter at least one value for debit or credit.");
        return;
      }

      if (debit > 0 && credit > 0) {
        alert("Use either debit or credit for this entry, not both.");
        return;
      }

      const entries = loadEntries();
      entries.push({
        title,
        debit,
        credit
      });

      saveEntries(entries);

      document.getElementById("title").value = "";
      document.getElementById("debit").value = "";
      document.getElementById("credit").value = "";

      renderAll();
    }

    document.getElementById("addEntryBtn").addEventListener("click", addEntry);
    renderAll();
  </script>
</body>
</html>
